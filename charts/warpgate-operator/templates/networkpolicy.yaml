{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "warpgate-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "warpgate-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "warpgate-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Health probes from kubelet
    - ports:
        - port: {{ .Values.health.port }}
          protocol: TCP
    {{- if .Values.metrics.enabled }}
    # Prometheus scrape
    - from:
        {{- if .Values.networkPolicy.metricsNamespaceSelector }}
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.metricsNamespaceSelector | nindent 14 }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
    {{- end }}
    {{- if .Values.webhooks.enabled }}
    # Admission webhook calls from kube-apiserver
    - ports:
        - port: {{ .Values.webhooks.port }}
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Kubernetes API and Warpgate HTTPS
    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}

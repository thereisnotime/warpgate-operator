{{- /*
Permission to request short-lived tokens (TokenRequest API) for the ServiceAccounts that
Kubernetes WarpgateTargets name in spec.kubernetes.serviceAccountToken. Granted per
namespace and limited by resourceNames to the listed ServiceAccounts: the manager
ClusterRole never gets serviceaccounts/token, so a WarpgateTarget can't make the operator
request tokens for any other ServiceAccount. (The manager ClusterRole can still create
Secrets and Deployments, so a compromised operator is not contained by this.) "get" on
the same ServiceAccounts lets it check their opt-in annotations.
*/ -}}
{{- if .Values.rbac.create }}
{{- $seen := dict }}
{{- range $i, $entry := .Values.serviceAccountTokens.allowed }}
{{- if not $entry.namespace }}
{{- fail (printf "serviceAccountTokens.allowed[%d].namespace is required" $i) }}
{{- end }}
{{- if hasKey $seen $entry.namespace }}
{{- fail (printf "serviceAccountTokens.allowed[%d]: namespace %q is listed twice; put all its ServiceAccounts in one entry" $i $entry.namespace) }}
{{- end }}
{{- $_ := set $seen $entry.namespace true }}
{{- if not $entry.serviceAccounts }}
{{- fail (printf "serviceAccountTokens.allowed[%d].serviceAccounts must list at least one ServiceAccount" $i) }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "warpgate-operator.fullname" $ }}-sa-tokens
  namespace: {{ $entry.namespace | quote }}
  labels:
    {{- include "warpgate-operator.labels" $ | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    resourceNames:
      {{- range $entry.serviceAccounts }}
      - {{ . | quote }}
      {{- end }}
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    resourceNames:
      {{- range $entry.serviceAccounts }}
      - {{ . | quote }}
      {{- end }}
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "warpgate-operator.fullname" $ }}-sa-tokens
  namespace: {{ $entry.namespace | quote }}
  labels:
    {{- include "warpgate-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "warpgate-operator.fullname" $ }}-sa-tokens
subjects:
  - kind: ServiceAccount
    name: {{ include "warpgate-operator.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}

                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              secretBackends:
                description: |-
                  secretBackends configures external secret backends (e.g. HashiCorp Vault / OpenBao).
                  Requires Warpgate v0.30.0+.
                properties:
                  vault:
                    description: vault configures a HashiCorp Vault or OpenBao secret
                      backend.
                    properties:
                      appRole:
                        description: |-
                          appRole configures AppRole authentication.
                          Mutually exclusive with tokenSecretRef.
                        properties:
                          roleID:
                            description: roleID is the AppRole role ID.
                            type: string
                          secretIDSecretRef:
                            description: secretIDSecretRef references a Secret whose
                              key holds the AppRole secret ID.
                            properties:
                              key:
                                description: |-
                                  key is the key within the Secret. Defaults to "password" for password refs.
                                  Unused by tokenSecretRef (which always reads "username" and "password" keys).
                                type: string
                              name:
                                description: name is the name of the Secret.
                                type: string
                            required:
                            - name
                            type: object
                        required:
                        - roleID
                        - secretIDSecretRef
                        type: object
                      caBundleSecretRef:
                        description: caBundleSecretRef references a Secret containing
                          a PEM CA bundle for the Vault TLS connection.
                        properties:
                          key:
                            description: |-
                              key is the key within the Secret. Defaults to "password" for password refs.
                              Unused by tokenSecretRef (which always reads "username" and "password" keys).
                            type: string
                          name:
                            description: name is the name of the Secret.
                            type: string
                        required:
                        - name
                        type: object
                      path:
                        default: secret
                        description: path is the KV mount path in Vault. Defaults
                          to "secret".
                        type: string
                      tlsSkipVerify:
                        description: |-
                          tlsSkipVerify disables TLS verification for the Vault connection.
                          Not recommended for production.
                        type: boolean
                      tokenSecretRef:
                        description: |-
                          tokenSecretRef references a Secret whose key holds the Vault token.
                          Mutually exclusive with appRole.
                        properties:
                          key:
                            description: |-
                              key is the key within the Secret. Defaults to "password" for password refs.
                              Unused by tokenSecretRef (which always reads "username" and "password" keys).
                            type: string
                          name:
                            description: name is the name of the Secret.
                            type: string
                        required:
                        - name
                        type: object
                      url:
                        description: url is the Vault/OpenBao server address (e.g.
                          "https://vault.example.com").
                        type: string
                    required:
                    - url
                    type: object
                type: object
              seedImage:
                description: |-
                  seedImage overrides the utility image used by the config-seed init container
                  on shell-less (distroless, Warpgate >= 0.27) deployments. It must contain a
                  POSIX shell plus cp/sed/awk (busybox does). Defaults to a pinned busybox.
                  Ignored for shell-bearing Warpgate images (<= 0.26), which seed in-image.
                type: string
              ssh:
                description: ssh configures the SSH protocol listener.
                properties:
                  enabled:
                    description: enabled enables the SSH listener.
                    type: boolean
                  port:
                    default: 2222
                    description: port is the container port. Defaults to 2222.
                    format: int32
                    type: integer
                  serviceType:
                    default: ClusterIP
                    description: serviceType for the SSH service. Defaults to ClusterIP.
                    enum:
                    - ClusterIP
                    - NodePort
                    - LoadBalancer
                    type: string
                type: object
              sshKeysSecretName:
                description: |-
                  sshKeysSecretName references a Secret containing SSH host/client keys.
                  Expected keys: client-ed25519, client-rsa, host-ed25519, host-rsa.
                  If not set, Warpgate generates its own keys on first boot.
                type: string
              sso:
                description: |-
                  sso configures OpenID Connect single sign-on providers. Each provider's
                  client secret is read from a referenced Secret and injected at runtime, so
                  it never lands in the generated ConfigMap. Ignored when configOverride is
                  set (the override owns the whole config).
                properties:
                  providers:
                    description: providers is the list of SSO providers to configure.
                    items:
                      description: |-
                        SSOProviderSpec is a single OpenID Connect provider (the generic "custom"
                        Warpgate provider type). Role syncing requires the provider to emit a
                        warpgate_roles claim, so include the scope that carries it in scopes.
                      properties:
                        additionalTrustedAudiences:
                          description: |-
                            additionalTrustedAudiences accepts ID tokens whose audience is one of these
                            values in addition to the client id.
                          items:
                            type: string
                          type: array
                        autoCreateUsers:
                          description: autoCreateUsers creates a Warpgate user on
                            first successful login.
                          type: boolean
                        clientID:
                          description: clientID is the OIDC client id.
                          type: string
                        clientSecretSecretRef:
                          description: |-
                            clientSecretSecretRef references a Secret key holding the OIDC client
                            secret. It is injected as an environment variable and written into the
                            config at runtime, so it is never stored in the ConfigMap.
                          properties:
                            key:
                              description: |-
                                key is the key within the Secret. Defaults to "password" for password refs.
                                Unused by tokenSecretRef (which always reads "username" and "password" keys).
                              type: string
                            name:
                              description: name is the name of the Secret.
                              type: string
                          required:
                          - name
                          type: object
                        issuerURL:
                          description: |-
                            issuerURL is the OIDC issuer URL; its /.well-known/openid-configuration
                            must be reachable from the Warpgate pod.
                          type: string
                        label:
                          description: label is the human-friendly name shown on the
                            login page. Defaults to name.
                          type: string
                        name:
                          description: |-
                            name is the provider's unique id, used in the login URL and as the key for
                            its injected client-secret environment variable.
                          type: string
                        roleMappings:
                          additionalProperties:
                            type: string
                          description: |-
                            roleMappings maps a value from the provider's warpgate_roles claim to a
                            Warpgate role name. When set, only the mapped roles are synced.
                          type: object
                        scopes:
                          description: |-
                            scopes are the OAuth scopes to request. Include the scope that carries the
                            warpgate_roles claim when using role sync.
                          items:
                            type: string
                          minItems: 1
                          type: array
                        trustUnknownAudiences:
                          description: trustUnknownAudiences disables audience validation
                            on the ID token.
                          type: boolean
                        type:
                          default: custom
                          description: |-
                            type is the Warpgate provider type. Only "custom" (generic OIDC) is
                            supported and it is the default.
                          enum:
                          - custom
                          type: string
                      required:
                      - clientID
                      - clientSecretSecretRef
                      - issuerURL
                      - name
                      - scopes
                      type: object
                    minItems: 1
                    type: array
                required:
                - providers
                type: object
              storage:
                description: storage configures persistent storage for Warpgate data.
                properties:
                  enabled:
                    default: true
                    description: enabled enables persistent storage via PVC. When
                      false, uses emptyDir.
                    type: boolean
                  existingClaimName:
                    description: existingClaimName uses an existing PVC instead of
                      creating one.
                    type: string
                  size:
                    default: 1Gi
                    description: size is the PVC size. Defaults to 1Gi.
                    type: string
                  storageClassName:
                    description: storageClassName overrides the default StorageClass.
                    type: string
                type: object
              strategy:
                default: Recreate
                description: |-
                  strategy overrides the default deployment update strategy.
                  Use "Recreate" when using RWO persistent volumes (default).
                enum:
                - Recreate
                - RollingUpdate
                type: string
              tls:
                description: tls configures TLS certificate provisioning.
                properties:
                  certManager:
                    description: |-
                      certManager enables automatic TLS cert provisioning via cert-manager.
                      The operator creates a Certificate whose Secret (<name>-tls) is mounted
                      into the pod and served by Warpgate. The Deployment is created once
                      cert-manager has issued that Secret.
                    type: boolean
                  issuerRef:
                    description: issuerRef references a custom cert-manager issuer.
                    properties:
                      kind:
                        description: kind is the issuer kind — Issuer or ClusterIssuer.
                        type: string
                      name:
                        description: name is the name of the issuer.
                        type: string
                    required:
                    - name
                    type: object
                  secretName:
                    description: |-
                      secretName references an existing TLS Secret (with tls.crt and tls.key).
                      If set, this Secret is mounted and served instead of the cert-manager one.
                    type: string
                  verifyConnection:
                    description: |-
                      verifyConnection controls TLS verification on the auto-created WarpgateConnection.
                      Unset: verify against the served TLS Secret (secretName, or the cert-manager Secret
                      when certManager is enabled) using its ca.crt, or tls.crt when there is no ca.crt.
                      Skip verification for the self-signed certificate generated inside the pod when
                      neither is configured, since the operator has no copy of it.
                      true: always verify; reconciliation fails if the operator has no CA to verify against.
                      false: never verify.
                    type: boolean
                type: object
              tolerations:
                description: tolerations for scheduling.
                items:
                  description: |-
                    The pod this Toleration is attached to tolerates any taint that matches
                    the triple <key,value,effect> using the matching operator <operator>.
                  properties:
                    effect:
                      description: |-
                        Effect indicates the taint effect to match. Empty means match all taint effects.
                        When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                      type: string
                    key:
                      description: |-
                        Key is the taint key that the toleration applies to. Empty means match all taint keys.
                        If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                      type: string
                    operator:
                      description: |-
                        Operator represents a key's relationship to the value.
                        Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                        Exists is equivalent to wildcard for value, so that a pod can
                        tolerate all taints of a particular category.
                        Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                      type: string
                    tolerationSeconds:
                      description: |-
                        TolerationSeconds represents the period of time the toleration (which must be
                        of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                        it is not set, which means tolerate the taint forever (do not evict). Zero and
                        negative values will be treated as 0 (evict immediately) by the system.
                      format: int64
                      type: integer
                    value:
                      description: |-
                        Value is the taint value the toleration matches to.
                        If the operator is Exists, the value should be empty, otherwise just a regular string.
                      type: string
                  type: object
                type: array
              version:
                default: 0.30.6
                description: |-
                  version is the Warpgate image tag to deploy (e.g. "0.21.1", "latest").
                  Defaults to the operator's current default when omitted.
                type: string
            required:
            - adminPasswordSecretRef
            type: object
          status:
            description: status defines the observed state of WarpgateInstance
            properties:
              conditions:
                description: conditions represent the current state of the WarpgateInstance
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              connectionRef:
                description: connectionRef is the name of the auto-created WarpgateConnection
                  CR.
                type: string
              endpoint:
                description: endpoint is the internal service URL for the Warpgate
                  API.
                type: string
              readyReplicas:
                description: readyReplicas is the number of ready pods.
                format: int32
                type: integer
              version:
                description: version is the currently deployed version.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      scale:
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.readyReplicas
      status: {}

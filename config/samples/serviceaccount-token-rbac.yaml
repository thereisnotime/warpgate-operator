# Lets the operator request short-lived tokens for one ServiceAccount, for a Kubernetes
# WarpgateTarget with spec.kubernetes.serviceAccountToken. Helm installs render this from
# serviceAccountTokens.allowed; raw-manifest installs apply it by hand.
#
# Adjust the namespace (where the WarpgateTarget and ServiceAccount live), the
# ServiceAccount name, and the operator's own ServiceAccount (subjects).
# resourceNames keeps the permission to exactly the listed ServiceAccounts.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: warpgate-k8s-drinking
  namespace: warpgate-operator
  annotations:
    # Audiences tokens for this ServiceAccount may be issued for (comma-separated).
    warpgate.warp.tech/token-audiences: zone10-drinking
    # clusterURLs its tokens may be sent to (comma-separated, exact match).
    warpgate.warp.tech/token-cluster-urls: https://192.168.42.49:6443
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: warpgate-operator-sa-tokens
  namespace: warpgate-operator
rules:
  - apiGroups: [""]
    resources: [serviceaccounts/token]
    resourceNames: [warpgate-k8s-drinking]
    verbs: [create]
  - apiGroups: [""]
    resources: [serviceaccounts]
    resourceNames: [warpgate-k8s-drinking]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: warpgate-operator-sa-tokens
  namespace: warpgate-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: warpgate-operator-sa-tokens
subjects:
  - kind: ServiceAccount
    name: warpgate-operator-controller-manager
    namespace: warpgate-operator-system

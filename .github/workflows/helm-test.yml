name: Helm Chart Test

on:
  push:
    paths:
      - "charts/**"
      - "config/crd/**"
      - ".github/workflows/helm-test.yml"
  pull_request:
    paths:
      - "charts/**"
      - "config/crd/**"
      - ".github/workflows/helm-test.yml"
  workflow_dispatch: {}

concurrency:
  group: helm-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.20.2

      - name: Lint chart
        run: helm lint charts/warpgate-operator

  template-validate:
    name: Template & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.20.2

      - name: Template chart
        run: helm template warpgate-operator charts/warpgate-operator > /tmp/rendered.yaml

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            -o kubeconform.tar.gz
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  kubeconform.tar.gz" | sha256sum -c
          tar xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Validate with kubeconform
        run: kubeconform -strict -ignore-missing-schemas -summary /tmp/rendered.yaml

      - name: Template and check serviceAccountTokens RBAC
        run: |
          set -euo pipefail
          # The default must not grant serviceaccounts/token anywhere. Match RBAC rule list
          # items only: the CRD descriptions mention serviceaccounts/token too.
          if grep -qE '^\s*- "?serviceaccounts/token"?$' /tmp/rendered.yaml; then
            echo "default render grants serviceaccounts/token" >&2; exit 1
          fi
          helm template warpgate-operator charts/warpgate-operator \
            -f hack/helm/serviceaccount-tokens-values.yaml > /tmp/rendered-sat.yaml
          kubeconform -strict -ignore-missing-schemas -summary /tmp/rendered-sat.yaml
          # One Role and RoleBinding per entry, each limited to its ServiceAccounts.
          test "$(grep -c '^kind: Role$' /tmp/rendered-sat.yaml)" -eq 2
          test "$(grep -c '^kind: RoleBinding$' /tmp/rendered-sat.yaml)" -eq 2
          test "$(grep -c '"warpgate-k8s-a"' /tmp/rendered-sat.yaml)" -eq 2
          test "$(grep -c '"warpgate-k8s-c"' /tmp/rendered-sat.yaml)" -eq 2
          # An incomplete entry must fail the render instead of granting nothing silently.
          if helm template warpgate-operator charts/warpgate-operator \
            --set 'serviceAccountTokens.allowed[0].namespace=x' >/dev/null 2>&1; then
            echo "an entry without serviceAccounts rendered" >&2; exit 1
          fi
          # A namespace listed twice would render two Roles with the same name.
          if helm template warpgate-operator charts/warpgate-operator \
            --set 'serviceAccountTokens.allowed[0].namespace=x' \
            --set 'serviceAccountTokens.allowed[0].serviceAccounts[0]=a' \
            --set 'serviceAccountTokens.allowed[1].namespace=x' \
            --set 'serviceAccountTokens.allowed[1].serviceAccounts[0]=b' >/dev/null 2>&1; then
            echo "a duplicate namespace rendered" >&2; exit 1
          fi

  install-test:
    name: Install Test (kind)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.20.2

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510  # v2.9.0

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2  # v1.15.0

      - name: Install cert-manager
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.17.2/cert-manager.yaml
          kubectl wait --for=condition=Available deployment --all -n cert-manager --timeout=120s

      - name: Install and test chart
        run: ct install --charts charts/warpgate-operator

name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    # Run weekly on Monday at 06:30 UTC (offset from security.yml to avoid congestion)
    - cron: "30 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  scorecard:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          # Use SCORECARD_TOKEN (PAT with public_repo scope) for publishing results to
          # the OpenSSF API. Falls back to GITHUB_TOKEN for analysis-only mode.
          repo_token: ${{ secrets.SCORECARD_TOKEN || secrets.GITHUB_TOKEN }}
          publish_results: ${{ secrets.SCORECARD_TOKEN != '' }}

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          sarif_file: scorecard.sarif
          category: ossf-scorecard
